# The Customer 360 map application (AppKit) + its Genie/focus-set setup jobs.
# Deploy the built app tree (app/deploy/, produced by `npm run build`), then run
# app_focus_set_setup once; app_genie_space is optional (enables "Ask the map").

resources:
  apps:
    customer_360:
      name: customer-360-for-utilities
      description: "Customer 360 for Utilities — executive map (value hex-grid + dots), conversational 'Ask the map' (Genie), box/lasso targeting, plus CSR and program views. Reads the single ${var.schema} schema."
      source_code_path: ../app/deploy/
      # WARNING (2026-07-13): this `config:` block is deprecated and CLI v1.1.0+
      # silently ignores it — the env overrides below never reach the app (the
      # 2026-07-13 empty-map incident: the app booted with app.yaml's fallback
      # catalog `main`). The real env now lives in app/app.yaml with concrete
      # values; this block is kept only for older CLIs that still apply it.
      config:
        command:
          - bash
          - -c
          - |
            for f in config/queries/*.sql; do
              sed -i "s#{{catalog}}#${DATABRICKS_CATALOG}#g; s#{{schema}}#${DATABRICKS_SCHEMA}#g" "$f"
            done
            exec node build/server.mjs
        env:
          - name: NODE_ENV
            value: production
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: DATABRICKS_CATALOG
            value: ${var.catalog}
          - name: DATABRICKS_SCHEMA
            value: ${var.schema}
          # Enables "Ask the map". Set from the app_genie_space job's created
          # space via --var genie_space_id=<id> (like warehouse_id, it's a
          # required per-environment value; the Apps runtime rejects an empty
          # value, so don't deploy this env with genie_space_id unset).
          - name: DATABRICKS_GENIE_SPACE_ID
            value: ${var.genie_space_id}
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

  jobs:
    app_focus_set_setup:
      name: ${bundle.name}_app_focus_set_setup
      description: "Creates ${var.schema}.app_focus_set, the per-session cohort carrier behind the map's focus-set scoping. Idempotent; run once after deploy."
      usage_policy_id: ${var.serverless_usage_policy_id}
      tags: { demo: customer-360-for-utilities }
      environments:
        - environment_key: default
          spec:
            client: ${var.serverless_version}
      tasks:
        - task_key: create_focus_set
          environment_key: default
          notebook_task:
            notebook_path: ../app/setup/02_focus_set_setup.py
            base_parameters:
              catalog: ${var.catalog}
              app_schema: ${var.schema}

    app_focus_set_ttl:
      name: ${bundle.name}_app_focus_set_ttl
      description: "Daily sweep of expired focus_set cohorts."
      usage_policy_id: ${var.serverless_usage_policy_id}
      tags: { demo: customer-360-for-utilities }
      schedule:
        quartz_cron_expression: "0 0 4 * * ?"
        timezone_id: America/Detroit
      environments:
        - environment_key: default
          spec:
            client: ${var.serverless_version}
      tasks:
        - task_key: sweep
          environment_key: default
          notebook_task:
            notebook_path: ../app/setup/03_focus_set_ttl.py
            base_parameters:
              catalog: ${var.catalog}
              app_schema: ${var.schema}
              retention_hours: "24"

    app_genie_space:
      name: ${bundle.name}_app_genie_space
      description: "Creates/updates the 'Ask the Map' Genie space over the curated_* tables. Run once, then set var.genie_space_id from its output."
      usage_policy_id: ${var.serverless_usage_policy_id}
      tags: { demo: customer-360-for-utilities }
      environments:
        - environment_key: default
          spec:
            client: ${var.serverless_version}
      tasks:
        - task_key: create_space
          environment_key: default
          notebook_task:
            notebook_path: ../app/setup/01_create_genie_space.py
            base_parameters:
              catalog: ${var.catalog}
              curated_schema: ${var.schema}
              app_schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              # Grant the app's SP CAN_RUN on the created space (see notebook).
              app_name: ${resources.apps.customer_360.name}
