# The Customer 360 map application (AppKit) + its Genie/focus-set setup jobs.
# Deploy the built app tree (app/deploy/, produced by `npm run build`), then run
# app_focus_set_setup once; app_genie_space is optional (enables "Ask the map").

resources:
  apps:
    customer_360:
      name: customer-360-for-utilities
      description: "Customer 360 for Utilities — executive map (value hex-grid + dots), conversational 'Ask the map' (Genie), box/lasso targeting, plus CSR and program views. Reads the single ${var.schema} schema."
      source_code_path: ../app/deploy/
      # OBO scopes forwarded to the end-user token. Deliberately NOT set here:
      # SP-mode targets must OMIT the field entirely, because the databricks
      # Terraform provider round-trips an empty list `[]` back as null and aborts
      # the apply ("inconsistent result after apply"). Each OBO target re-adds it
      # via a per-target resources override in databricks.yml (= [sql,
      # dashboards.genie]) — currently dev, external, and internal; only the
      # vestigial `prod` target is still SP and omits it. check-release-config.py's
      # cross-check is None-guarded, so an absent field for SP targets is fine.
      # See databricks.yml var app_user_api_scopes.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

  jobs:
    app_focus_set_setup:
      name: ${bundle.name}_app_focus_set_setup
      description: "Creates ${var.schema}.app_focus_set, the per-session cohort carrier behind the map's focus-set scoping. Idempotent; run once after deploy."
      usage_policy_id: ${var.serverless_usage_policy_id}
      tags: ${var.data_asset_tags}
      environments:
        - environment_key: default
          spec:
            client: ${var.serverless_version}
      tasks:
        - task_key: create_focus_set
          environment_key: default
          notebook_task:
            notebook_path: ../app/setup/02_focus_set_setup.py
            base_parameters:
              catalog: ${var.catalog}
              app_schema: ${var.schema}

    app_focus_set_ttl:
      name: ${bundle.name}_app_focus_set_ttl
      description: "Daily sweep of expired focus_set cohorts."
      usage_policy_id: ${var.serverless_usage_policy_id}
      tags: ${var.data_asset_tags}
      schedule:
        quartz_cron_expression: "0 0 4 * * ?"
        timezone_id: America/Detroit
      environments:
        - environment_key: default
          spec:
            client: ${var.serverless_version}
      tasks:
        - task_key: sweep
          environment_key: default
          notebook_task:
            notebook_path: ../app/setup/03_focus_set_ttl.py
            base_parameters:
              catalog: ${var.catalog}
              app_schema: ${var.schema}
              retention_hours: "24"

    app_genie_space:
      name: ${bundle.name}_app_genie_space
      description: "Creates/updates the 'Ask the Map' Genie space over the curated_* tables. Run once, then set var.genie_space_id from its output."
      usage_policy_id: ${var.serverless_usage_policy_id}
      tags: ${var.data_asset_tags}
      environments:
        - environment_key: default
          spec:
            client: ${var.serverless_version}
      tasks:
        - task_key: create_space
          environment_key: default
          notebook_task:
            notebook_path: ../app/setup/01_create_genie_space.py
            base_parameters:
              catalog: ${var.catalog}
              curated_schema: ${var.schema}
              app_schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              # Grant the app's SP CAN_RUN on the created space (see notebook).
              app_name: ${resources.apps.customer_360.name}
              # Genie ACL grantee selection: sp → app SP, obo → viewer_grantee.
              auth_mode: ${var.app_auth_mode}
              viewer_grantee: ${var.viewer_grantee}
