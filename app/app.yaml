# On startup, substitute the {{catalog}}/{{schema}} placeholders in the analytics
# query files with the injected env (AppKit reads query .sql files verbatim — no
# templating — so we bind them to this environment at boot), then launch the
# server. Keeps the app deploy-anywhere: no rebuild per environment.
command:
  - bash
  - -c
  - |
    for f in config/queries/*.sql; do
      sed -i "s#{{catalog}}#${DATABRICKS_CATALOG}#g; s#{{schema}}#${DATABRICKS_SCHEMA}#g" "$f"
    done
    exec node build/server.mjs
env:
  - name: NODE_ENV
    value: production
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Per-environment values. These MUST be correct here: the DAB app resource's
  # `config:` env override (resources/app.yml) is deprecated and current CLI
  # versions (>= v1.x) no longer apply it at deploy — the app runs with exactly
  # what this file says. The values below are the default (current-workspace)
  # deploy; scripts/stage-deploy.sh overrides any of them from the matching env
  # var (DATABRICKS_CATALOG / DATABRICKS_SCHEMA / DATABRICKS_GENIE_SPACE_ID /
  # DATABRICKS_AUTH_MODE) when set, so a different environment needs no edit here
  # — just export the var before `npm run build`, or drop your values in the
  # gitignored `app/scripts/dev-env.sh`, which the build auto-loads.
  - name: DATABRICKS_CATALOG
    value: main
  - name: DATABRICKS_SCHEMA
    value: customer_360
  - name: DATABRICKS_GENIE_SPACE_ID
    value: REPLACE_WITH_YOUR_GENIE_SPACE_ID
  # sp | obo. Drives the app's read identity: in obo mode
  # dbx.ts (custom plugins) and the useC360Query wrapper (analytics reads) both
  # run AS THE VIEWER via the forwarded user token; in sp mode everything runs as
  # the app service principal (today's default). stage-deploy.sh sets this per
  # target; the server exposes it to the browser via GET /api/config/client.
  - name: DATABRICKS_AUTH_MODE
    value: sp
